<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title data-ru="Мои займы" data-en="My Loans">Мои займы</title>
    <th:block th:replace="~{fragments/head :: styles}"></th:block>
    <style>
        .loan-number-link {
            display: inline-block; padding: 4px 10px;
            font-size: 13px; font-weight: 800; color: #00b894;
            text-decoration: none; border: 1px solid #00b894;
            background: #e6faf5; letter-spacing: 0.3px;
            transition: all 0.15s ease;
        }
        .loan-number-link:hover { background: #00b894; color: #fff; }
        body.theme-dark .loan-number-link { background: #0a2e27; color: #00d4a8; border-color: #00d4a8; }
        body.theme-dark .loan-number-link:hover { background: #00d4a8; color: #111; }

        .item-cell {
            display: flex; align-items: baseline; justify-content: center;
            gap: 6px; flex-wrap: nowrap;
        }
        .item-cell .item-name-static { color: #000; font-size: 14px; font-weight: 400; white-space: nowrap; line-height: 1; max-width: 180px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle; }
        .item-cell .item-number-static { font-size: 13px; color: #00b894; font-weight: 400; letter-spacing: 0.3px; white-space: nowrap; line-height: 1; }
        body.theme-dark .item-cell .item-name-static { color: #e0e0e0; }
        body.theme-dark .item-cell .item-number-static { color: #00d4a8; }

        .due-cell { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .due-date { font-size: 13px; color: #000; }
        body.theme-dark .due-date { color: #e0e0e0; }

        .timer-badge {
            display: inline-block; padding: 4px 10px;
            font-size: 11px; font-weight: 700; border: 1px solid; white-space: nowrap;
        }
        .timer-badge.timer-success { color: #10b981; border-color: #10b981; background: #ecfdf5; }
        .timer-badge.timer-warning { color: #f59e0b; border-color: #f59e0b; background: #fffbeb; }
        .timer-badge.timer-danger  { color: #e74c3c; border-color: #e74c3c; background: #fef2f2; }
        body.theme-dark .timer-badge.timer-success { background: #052e22; color: #34d399; border-color: #34d399; }
        body.theme-dark .timer-badge.timer-warning { background: #2e2005; color: #fbbf24; border-color: #fbbf24; }
        body.theme-dark .timer-badge.timer-danger  { background: #2e0505; color: #ff6b6b; border-color: #ff6b6b; }

        .loans-top-bar { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; margin-bottom: 25px; }
        .loans-top-bar h2 { margin: 0; }

        .loans-filters {
            display: flex; gap: 0; border: 1px solid #e0e0e0;
            align-items: stretch; background: #fff;
            width: 100%; max-width: 900px;
        }
        .loans-filters input[type="text"] {
            padding: 10px 14px; font-size: 13px; border: none; outline: none;
            background: #fff; color: #000; font-family: inherit;
            min-width: 260px; flex: 1;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }
        .loans-filters input[type="text"]::placeholder { color: #999; text-overflow: ellipsis; }
        .loans-filters select {
            padding: 10px 14px; font-size: 13px; border: none; outline: none;
            background: #fff; color: #000; font-family: inherit; cursor: pointer;
        }
        .loans-filters .filter-divider { width: 1px; background: #e0e0e0; align-self: stretch; }
        body.theme-dark .loans-filters { border-color: #2a2a2a; background: #1e1e1e; }
        body.theme-dark .loans-filters input[type="text"] { background: #1e1e1e; color: #e0e0e0; }
        body.theme-dark .loans-filters input[type="text"]::placeholder { color: #666; }
        body.theme-dark .loans-filters select { background: #1e1e1e; color: #e0e0e0; }
        body.theme-dark .loans-filters .filter-divider { background: #2a2a2a; }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content with-sidebar">
    <div class="loans-top-bar">
        <h2 data-ru="Мои займы" data-en="My Loans">Мои займы</h2>

        <form class="loans-filters" method="get" th:action="@{/client/loans}" id="loansFilterForm">
            <input type="text" name="query" th:value="${query}"
                   data-ru="Поиск по номеру займа, вещи или номеру вещи..."
                   data-en="Search by loan number, item or item number..."
                   placeholder="Поиск по номеру займа, вещи или номеру вещи..."
                   oninput="autoSubmit()">

            <span class="filter-divider"></span>

            <select name="status" onchange="this.form.submit()">
                <option value="" th:selected="${status == null or status.isEmpty()}" data-ru="Все статусы" data-en="All statuses">Все статусы</option>
                <option value="В ожидании" th:selected="${status == 'В ожидании'}" data-ru="В ожидании" data-en="Pending">В ожидании</option>
                <option value="Ожидает подтверждения" th:selected="${status == 'Ожидает подтверждения'}" data-ru="Ожидает подтверждения" data-en="Awaiting Confirmation">Ожидает подтверждения</option>
                <option value="Выдан" th:selected="${status == 'Выдан'}" data-ru="Выдан" data-en="Issued">Выдан</option>
                <option value="Закрыт" th:selected="${status == 'Закрыт'}" data-ru="Закрыт" data-en="Closed">Закрыт</option>
                <option value="Просрочен" th:selected="${status == 'Просрочен'}" data-ru="Просрочен" data-en="Overdue">Просрочен</option>
                <option value="Отменена" th:selected="${status == 'Отменена'}" data-ru="Отменена" data-en="Cancelled">Отменена</option>
                <option value="Отклонен" th:selected="${status == 'Отклонен'}" data-ru="Отклонен" data-en="Rejected">Отклонен</option>
            </select>

            <span class="filter-divider"></span>

            <select name="sort" onchange="this.form.submit()">
                <option value="id" th:selected="${sort == 'id'}" data-ru="Сначала новые" data-en="Newest first">Сначала новые</option>
                <option value="date_asc" th:selected="${sort == 'date_asc'}" data-ru="Сначала старые" data-en="Oldest first">Сначала старые</option>
                <option value="amount_desc" th:selected="${sort == 'amount_desc'}" data-ru="По сумме (убыв.)" data-en="By amount (desc)">По сумме (убыв.)</option>
                <option value="amount_asc" th:selected="${sort == 'amount_asc'}" data-ru="По сумме (возр.)" data-en="By amount (asc)">По сумме (возр.)</option>
            </select>
        </form>
    </div>

    <div class="table-wrap" th:if="${not #lists.isEmpty(loans)}">
        <table>
            <thead>
            <tr>
                <th data-ru="Номер займа" data-en="Loan Number">Номер займа</th>
                <th data-ru="Вещь" data-en="Item">Вещь</th>
                <th data-ru="Статус" data-en="Status">Статус</th>
                <th data-ru="К возврату" data-en="Total to Return">К возврату</th>
                <th data-ru="Вернуть до / Осталось" data-en="Due / Time Left">Вернуть до / Осталось</th>
                <th data-ru="Действия" data-en="Actions">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="loan : ${loans}" th:classappend="${loan.overdue} ? 'overdue' : ''">
                <td>
                    <a th:href="@{/loans/{id}(id=${loan.id})}"
                       class="loan-number-link"
                       th:text="${loan.loanNumber}">L71533</a>
                </td>
                <td>
                    <div class="item-cell" th:if="${not #lists.isEmpty(loan.collaterals)}">
                        <span class="item-name-static" th:text="${loan.collaterals[0].name} ?: '-'"></span>
                        <span class="item-number-static" th:text="'(' + ${loan.collaterals[0].itemNumber} + ')'"></span>
                    </div>
                    <span th:if="${#lists.isEmpty(loan.collaterals)}">-</span>
                </td>
                <td>
                    <span class="status-badge status-waiting" th:if="${loan.status == 'В ожидании'}" data-ru="В ожидании" data-en="Pending">В ожидании</span>
                    <span class="status-badge status-waiting" th:if="${loan.status == 'Ожидает подтверждения'}" data-ru="Ожидает подтверждения" data-en="Awaiting Confirmation">Ожидает подтверждения</span>
                    <span class="status-badge status-approved" th:if="${loan.status == 'Одобрен'}" data-ru="Одобрен" data-en="Approved">Одобрен</span>
                    <span class="status-badge status-rejected" th:if="${loan.status == 'Отклонен'}" data-ru="Отклонен" data-en="Rejected">Отклонен</span>
                    <span class="status-badge status-issued" th:if="${loan.status == 'Выдан'}" data-ru="Выдан" data-en="Issued">Выдан</span>
                    <span class="status-badge status-closed" th:if="${loan.status == 'Закрыт'}" data-ru="Закрыт" data-en="Closed">Закрыт</span>
                    <span class="status-badge status-sold" th:if="${loan.status == 'На продаже'}" data-ru="В магазине" data-en="In Shop">В магазине</span>
                    <span class="status-badge status-cancelled-loan" th:if="${loan.status == 'Отменена'}" data-ru="Отменена" data-en="Cancelled">Отменена</span>
                    <span class="status-badge status-overdue" th:if="${loan.status == 'Просрочен'}" data-ru="Просрочен" data-en="Overdue">Просрочен</span>
                    <span class="status-badge status-instock" th:if="${loan.status == 'На складе'}" data-ru="На складе" data-en="In Stock">На складе</span>
                    <span class="status-badge status-purchased" th:if="${loan.status == 'Куплен'}" data-ru="Куплен" data-en="Purchased">Куплен</span>
                </td>
                <td>
                    <span th:if="${loan.rate != null}" th:text="${#numbers.formatDecimal(loan.totalToReturn, 1, 2)} + ' ₽'"></span>
                    <span th:if="${loan.rate == null}">-</span>
                </td>
                <td>
                    <div class="due-cell">
                        <span class="due-date" th:text="${loan.dueDate} ?: '-'"></span>
                        <span th:if="${loan.status == 'Выдан' or loan.status == 'Просрочен'}"
                              class="timer-badge"
                              th:classappend="${loan.timerClass}"
                              th:text="${loan.timerLabel}"></span>
                    </div>
                </td>
                <td>
                    <form th:action="@{/client/loans/{id}/repay(id=${loan.id})}" method="post"
                          th:if="${loan.status == 'Выдан' or loan.status == 'Просрочен'}"
                          onsubmit="return openConfirmForm(this, 'Погасить заем? С баланса спишется вся сумма к возврату.', 'Погасить')"
                          style="display:inline; margin:0;">
                        <button type="submit" class="btn-green" style="padding:6px 14px; font-size:12px;"
                                data-ru="Погасить" data-en="Repay">Погасить</button>
                    </form>

                    <form th:if="${loan.status == 'В ожидании'}"
                          th:action="@{/client/loans/{id}/cancel(id=${loan.id})}"
                          method="post"
                          onsubmit="return openConfirmForm(this, 'Отменить заявку?', 'Отменить')"
                          style="display:inline; margin:0;">
                        <button type="submit" class="btn-red"
                                style="padding:6px 14px; font-size:12px;"
                                data-ru="Отменить" data-en="Cancel">Отменить</button>
                    </form>

                    <span th:if="${loan.status != 'Выдан' and loan.status != 'Просрочен' and loan.status != 'В ожидании'}"
                          style="color:#ccc;">-</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-message" th:if="${#lists.isEmpty(loans)}"
         data-ru="Заявок не найдено." data-en="No requests found.">
        Заявок не найдено.
    </div>

    <div class="pagination-wrap" th:if="${totalPages != null and totalPages > 1}">
        <div class="pagination-info">
            <span data-ru="Всего заявок" data-en="Total requests">Всего заявок</span>:
            <span th:text="${totalItems}"></span>,
            <span data-ru="страница" data-en="page">страница</span>
            <span th:text="${currentPage}"></span>
            <span data-ru="из" data-en="of">из</span>
            <span th:text="${totalPages}"></span>
        </div>
        <a th:if="${currentPage > 1}" th:href="@{/client/loans(page=${currentPage - 1}, sort=${sort}, status=${status}, query=${query})}" class="page-btn">
            ← <span data-ru="Назад" data-en="Back">Назад</span>
        </a>
        <span th:if="${currentPage <= 1}" class="page-btn disabled">
            ← <span data-ru="Назад" data-en="Back">Назад</span>
        </span>
        <a th:each="i : ${#numbers.sequence(1, totalPages)}" th:href="@{/client/loans(page=${i}, sort=${sort}, status=${status}, query=${query})}"
           class="page-btn" th:classappend="${i == currentPage} ? 'active' : ''" th:text="${i}"></a>
        <a th:if="${currentPage < totalPages}" th:href="@{/client/loans(page=${currentPage + 1}, sort=${sort}, status=${status}, query=${query})}" class="page-btn">
            <span data-ru="Вперед" data-en="Next">Вперед</span> →
        </a>
        <span th:if="${currentPage >= totalPages}" class="page-btn disabled">
            <span data-ru="Вперед" data-en="Next">Вперед</span> →
        </span>
    </div>
</div>

<div th:replace="~{fragments/settings :: settings}"></div>

<script>
    let autoSubmitTimer = null;
    function autoSubmit() {
        clearTimeout(autoSubmitTimer);
        autoSubmitTimer = setTimeout(function() {
            document.getElementById('loansFilterForm').submit();
        }, 500);
    }
</script>

</body>
</html>
