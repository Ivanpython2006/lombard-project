<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title data-ru="Менеджеры" data-en="Managers">Менеджеры</title>
    <th:block th:replace="~{fragments/head :: styles}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content with-sidebar">
    <div class="page-toolbar">
        <h2 class="mb-0" data-ru="Менеджеры" data-en="Managers">Менеджеры</h2>
        <a href="/admin/users" class="btn"
           data-ru="← К работникам" data-en="← Back to Employees">← К работникам</a>
    </div>

    <div class="table-wrap" th:if="${not #lists.isEmpty(managers)}">
        <table>
            <thead>
            <tr>
                <th data-ru="ID" data-en="ID">ID</th>
                <th data-ru="Логин" data-en="Login">Логин</th>
                <th data-ru="Роль" data-en="Role">Роль</th>
                <th data-ru="Действия" data-en="Actions">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${managers}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.username}"></td>
                <td th:text="${m.role}"></td>
                <td>
                    <a th:href="@{/admin/managers/{id}(id=${m.id})}" class="btn btn-sm"
                       data-ru="Открыть профиль" data-en="Open Profile">Открыть профиль</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-message" th:if="${#lists.isEmpty(managers)}"
         data-ru="Менеджеров нет." data-en="No managers.">
        Менеджеров нет.
    </div>
</div>

<div th:replace="~{fragments/settings :: settings}"></div>
</body>
</html>
