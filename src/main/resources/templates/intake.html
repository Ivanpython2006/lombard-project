<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title data-ru="Прием вещей" data-en="Intake">Прием вещей</title>
    <th:block th:replace="~{fragments/head :: styles}"></th:block>
    <style>
        .action-buttons-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
        }
        .action-buttons-row .action-btn {
            padding: 8px 12px;
            font-size: 11px;
            white-space: nowrap;
            margin: 0;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content with-sidebar">
    <!-- Шапка с заголовком и кнопкой экспорта -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; flex-wrap:wrap; gap:12px;">
        <h2 style="margin-bottom:0;" data-ru="Прием вещей" data-en="Intake of Items">Прием вещей</h2>
        <a href="/admin/intake/export" class="btn" data-ru="Экспорт CSV" data-en="Export CSV">Экспорт CSV</a>
    </div>

    <form class="filter-bar" th:action="@{/admin/intake}" method="get" id="filterForm">
        <input type="text" name="query" th:value="${query}"
               data-ru="Поиск по номеру, клиенту или вещи..."
               data-en="Search by number, client or item..."
               placeholder="Поиск по номеру, клиенту или вещи..."
               oninput="autoSubmit()">
        <span class="filter-divider"></span>
        <select name="sort" onchange="this.form.submit()">
            <option value="new" th:selected="${sort == 'new' or sort == null}" data-ru="Сначала новые" data-en="Newest first">Сначала новые</option>
            <option value="old" th:selected="${sort == 'old'}" data-ru="Сначала старые" data-en="Oldest first">Сначала старые</option>
            <option value="amount_desc" th:selected="${sort == 'amount_desc'}" data-ru="По сумме (убыв.)" data-en="By amount (desc)">По сумме (убыв.)</option>
            <option value="amount_asc" th:selected="${sort == 'amount_asc'}" data-ru="По сумме (возр.)" data-en="By amount (asc)">По сумме (возр.)</option>
        </select>
    </form>

    <div class="table-wrap" th:if="${not #lists.isEmpty(loans)}">
        <table>
            <thead>
            <tr>
                <th data-ru="Номер" data-en="Number">Номер</th>
                <th data-ru="Клиент" data-en="Client">Клиент</th>
                <th data-ru="Вещь" data-en="Item">Вещь</th>
                <th data-ru="Описание" data-en="Description">Описание</th>
                <th data-ru="Запрошено" data-en="Requested">Запрошено</th>
                <th data-ru="Дата" data-en="Date">Дата</th>
                <th data-ru="Действия" data-en="Actions">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="loan : ${loans}">
                <td>
                    <b th:if="${not #lists.isEmpty(loan.collaterals)}"
                       th:text="${loan.collaterals[0].itemNumber}"
                       style="color:#00b894;"></b>
                    <span th:if="${#lists.isEmpty(loan.collaterals)}">—</span>
                </td>
                <td th:text="${loan.client != null ? loan.client.fullName : '—'}"></td>
                <td th:text="${not #lists.isEmpty(loan.collaterals) ? loan.collaterals[0].name : '—'}"></td>
                <td style="max-width:300px; word-break:break-word; text-align:left;"
                    th:text="${not #lists.isEmpty(loan.collaterals) ? loan.collaterals[0].description : '—'}"></td>
                <td th:text="${loan.amount} + ' ₽'"></td>
                <td th:text="${loan.createdDate}"></td>
                <td>
                    <div class="action-buttons-row">
                        <a th:href="@{/loans/{id}/approve(id=${loan.id})}" class="action-btn approve"
                           data-ru="Оценить" data-en="Evaluate">Оценить</a>

                        <form th:action="@{/loans/{id}/status(id=${loan.id})}" method="post"
                              onsubmit="return openConfirmForm(this, 'Отклонить заявку?', 'Отклонить')"
                              style="display:inline; margin:0;">
                            <input type="hidden" name="status" value="Отклонен">
                            <button type="submit" class="action-btn reject"
                                    data-ru="Отклонить" data-en="Reject">Отклонить</button>
                        </form>

                        <a th:href="@{/loans/{id}(id=${loan.id})}" class="action-btn"
                           data-ru="Открыть" data-en="Open">Открыть</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-message" th:if="${#lists.isEmpty(loans)}"
         data-ru="Заявок на прием пока нет." data-en="No intake requests yet.">
        Заявок на прием пока нет.
    </div>

    <div class="pagination-wrap" th:if="${totalPages != null and totalPages > 1}">
        <div class="pagination-info">
            <span data-ru="Всего заявок" data-en="Total requests">Всего заявок</span>:
            <span th:text="${totalItems}"></span>,
            <span data-ru="страница" data-en="page">страница</span>
            <span th:text="${currentPage}"></span>
            <span data-ru="из" data-en="of">из</span>
            <span th:text="${totalPages}"></span>
        </div>
        <a th:if="${currentPage > 1}" th:href="@{/admin/intake(page=${currentPage - 1}, query=${query}, sort=${sort})}" class="page-btn">
            ← <span data-ru="Назад" data-en="Back">Назад</span>
        </a>
        <span th:if="${currentPage <= 1}" class="page-btn disabled">
            ← <span data-ru="Назад" data-en="Back">Назад</span>
        </span>
        <a th:each="i : ${#numbers.sequence(1, totalPages)}" th:href="@{/admin/intake(page=${i}, query=${query}, sort=${sort})}"
           class="page-btn" th:classappend="${i == currentPage} ? 'active' : ''" th:text="${i}"></a>
        <a th:if="${currentPage < totalPages}" th:href="@{/admin/intake(page=${currentPage + 1}, query=${query}, sort=${sort})}" class="page-btn">
            <span data-ru="Вперед" data-en="Next">Вперед</span> →
        </a>
        <span th:if="${currentPage >= totalPages}" class="page-btn disabled">
            <span data-ru="Вперед" data-en="Next">Вперед</span> →
        </span>
    </div>
</div>

<div th:replace="~{fragments/settings :: settings}"></div>

<script>
    let autoSubmitTimer = null;
    function autoSubmit() {
        clearTimeout(autoSubmitTimer);
        autoSubmitTimer = setTimeout(function() {
            document.getElementById('filterForm').submit();
        }, 500);
    }
</script>
</body>
</html>
