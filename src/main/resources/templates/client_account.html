<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- УБРАНА Ё -->
    <title data-ru="Мой счет" data-en="My Account">Мой счет</title>
    <th:block th:replace="~{fragments/head :: styles}"></th:block>
</head>
<body class="page-client-account">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content with-sidebar">
    <!-- УБРАНА Ё -->
    <h2 class="text-center mb-20" data-ru="Мой счет" data-en="My Account">Мой счет</h2>

    <div class="balance-compact">
        <div class="balance-compact-left">
            <span class="balance-compact-label" data-ru="Текущий баланс" data-en="Current Balance">Текущий баланс</span>
            <span class="balance-compact-value">
                <span th:text="${#numbers.formatDecimal(account.balance, 1, 2)}">0.00</span> ₽
            </span>
        </div>
        <div class="balance-compact-owner">
            <span data-ru="Владелец:" data-en="Owner:">Владелец:</span>
            <b th:text="${client.fullName}"></b>
        </div>
    </div>

    <div class="forms-grid">
        <div class="form-mini deposit">
            <h3 data-ru="Пополнить счет" data-en="Top Up Account">Пополнить счет</h3>
            <form th:action="@{/client/account/deposit}" method="post">
                <div class="form-group">
                    <label for="depositAmount" data-ru="Сумма (₽)" data-en="Amount (₽)">Сумма (₽)</label>
                    <input type="number" id="depositAmount" name="amount"
                           data-ru="Например: 10000" data-en="For example: 10000"
                           placeholder="Например: 10000" min="1" step="1" required>
                </div>
                <div class="form-group">
                    <label for="depositComment" data-ru="Комментарий" data-en="Comment">Комментарий</label>
                    <input type="text" id="depositComment" name="comment"
                           data-ru="Необязательно" data-en="Optional"
                           placeholder="Необязательно" maxlength="200">
                </div>
                <button type="submit" class="btn-green"
                        data-ru="Пополнить" data-en="Top Up">Пополнить</button>
            </form>
        </div>

        <div class="form-mini withdraw">
            <h3 data-ru="Вывести средства" data-en="Withdraw Funds">Вывести средства</h3>
            <form th:action="@{/client/account/withdraw}" method="post">
                <div class="form-group">
                    <label for="withdrawAmount" data-ru="Сумма (₽)" data-en="Amount (₽)">Сумма (₽)</label>
                    <input type="number" id="withdrawAmount" name="amount"
                           data-ru="Например: 5000" data-en="For example: 5000"
                           placeholder="Например: 5000" min="1" step="1" required>
                </div>
                <div class="form-group">
                    <label for="withdrawComment" data-ru="Комментарий" data-en="Comment">Комментарий</label>
                    <input type="text" id="withdrawComment" name="comment"
                           data-ru="Необязательно" data-en="Optional"
                           placeholder="Необязательно" maxlength="200">
                </div>
                <button type="submit" class="btn-red"
                        data-ru="Вывести" data-en="Withdraw">Вывести</button>
            </form>
        </div>
    </div>

    <div class="history-mini">
        <h3 data-ru="История операций" data-en="Transaction History">История операций</h3>

        <div class="table-wrap" th:if="${not #lists.isEmpty(transactions)}">
            <table>
                <thead>
                <tr>
                    <th data-ru="Дата" data-en="Date">Дата</th>
                    <th data-ru="Тип" data-en="Type">Тип</th>
                    <th data-ru="Сумма" data-en="Amount">Сумма</th>
                    <th data-ru="Описание" data-en="Description">Описание</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tx : ${transactions}">
                    <td th:text="${#temporals.format(tx.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td>
                        <span th:if="${tx.type == 'DEPOSIT'}" class="tx-deposit"
                              data-ru="Пополнение" data-en="Deposit">Пополнение</span>
                        <span th:if="${tx.type == 'WITHDRAW'}" class="tx-withdraw"
                              data-ru="Вывод" data-en="Withdrawal">Вывод</span>
                        <span th:if="${tx.type == 'PURCHASE'}" class="tx-purchase"
                              data-ru="Покупка" data-en="Purchase">Покупка</span>
                        <span th:if="${tx.type == 'REFUND'}" class="tx-refund"
                              data-ru="Возврат" data-en="Refund">Возврат</span>
                    </td>
                    <td>
                        <span class="text-success fw-bold" th:if="${tx.type == 'DEPOSIT' or tx.type == 'REFUND'}">
                            +<span th:text="${#numbers.formatDecimal(tx.amount, 1, 2)}"></span> ₽
                        </span>
                        <span class="text-danger fw-bold" th:if="${tx.type == 'WITHDRAW' or tx.type == 'PURCHASE'}">
                            −<span th:text="${#numbers.formatDecimal(tx.amount, 1, 2)}"></span> ₽
                        </span>
                    </td>
                    <td th:text="${tx.description} ?: '—'"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(transactions)}"
             data-ru="Операций пока нет." data-en="No transactions yet.">
            Операций пока нет.
        </div>
    </div>
</div>

<div th:replace="~{fragments/settings :: settings}"></div>
</body>
</html>
