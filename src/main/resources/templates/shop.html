<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title data-ru="Магазин" data-en="Shop">Магазин</title>
    <th:block th:replace="~{fragments/head :: styles}"></th:block>
</head>
<body class="page-shop">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content with-sidebar">
    <div class="shop-header">
        <div>
            <h2 class="mb-8" data-ru="Магазин" data-en="Shop">Магазин</h2>
            <p class="subtitle mb-0"
               data-ru="Вещи из ломбарда, выставленные на продажу"
               data-en="Items from the pawnshop available for sale">Вещи из ломбарда, выставленные на продажу</p>
        </div>
        <div class="d-flex gap-10 flex-wrap">
            <a th:if="${isAdminOrManager}" href="/shop/manage" class="btn"
               data-ru="Управление магазином" data-en="Manage Shop">Управление магазином</a>

            <a th:if="${isClient}" href="/client/cart" class="btn border-accent text-accent">
                <span data-ru="Корзина" data-en="Cart">Корзина</span>
                <span th:if="${cartCount > 0}" th:text="'(' + ${cartCount} + ')'"></span>
            </a>
        </div>
    </div>

    <div class="cards" th:if="${not #lists.isEmpty(loans)}">
        <div class="card" th:each="loan : ${loans}">
            <div class="card-title-row">
                <span class="badge-accent" th:if="${not #lists.isEmpty(loan.collaterals)}"
                      th:text="${loan.collaterals[0].itemNumber}">
                </span>
                <div th:if="${cartLoanIds != null and cartLoanIds.contains(loan.id)}">
                    <span class="card-cart-badge" data-ru="В корзине" data-en="In Cart">В корзине</span>
                </div>
            </div>

            <div th:if="${not #lists.isEmpty(loan.collaterals)}"
                 th:replace="~{fragments/photo-slider :: slider(${loan.collaterals[0].photoUrls}, ${loan.collaterals[0].name}, 220)}"></div>
            <div th:if="${#lists.isEmpty(loan.collaterals)}"
                 class="photo-slider-empty h-220 mb-12"
                 data-ru="Нет фото" data-en="No photo">Нет фото</div>

            <div class="card-name"
                 th:text="${not #lists.isEmpty(loan.collaterals) ? loan.collaterals[0].name : '-'}"></div>
            <div class="card-desc"
                 th:text="${not #lists.isEmpty(loan.collaterals) ? loan.collaterals[0].description : '-'}"></div>
            <div>
                <div class="card-label" data-ru="Цена" data-en="Price">Цена</div>
                <div class="card-price"
                     th:text="${not #lists.isEmpty(loan.collaterals) and loan.collaterals[0].estimatedPrice != null}
                              ? ${#numbers.formatDecimal(loan.collaterals[0].estimatedPrice, 1, 2)} + ' ₽'
                              : '-'"></div>
            </div>

            <th:block th:if="${isClient}">
                <a th:if="${cartLoanIds != null and cartLoanIds.contains(loan.id)}"
                   href="/client/cart"
                   class="btn-cart btn-in-cart w-100 mt-auto"
                   data-ru="В корзине перейти" data-en="In Cart Open">
                    В корзине перейти
                </a>
                <form class="w-100 mt-auto" th:unless="${cartLoanIds != null and cartLoanIds.contains(loan.id)}"
                      th:action="@{/shop/{id}/add-to-cart(id=${loan.id})}" method="post">
                    <button type="submit" class="btn-cart w-100"
                            data-ru="В корзину" data-en="Add to Cart">
                        В корзину
                    </button>
                </form>
            </th:block>

            <a th:if="${isAdminOrManager}"
               href="/shop/manage"
               class="btn-cart btn-manage w-100 mt-auto"
               data-ru="Управление магазином" data-en="Manage Shop">
                Управление магазином
            </a>
        </div>
    </div>

    <div class="empty-message" th:if="${#lists.isEmpty(loans)}"
         data-ru="В магазине пока нет товаров." data-en="No items in the shop yet.">
        В магазине пока нет товаров.
    </div>

    <div class="pagination-wrap" th:if="${totalPages != null and totalPages > 1}">
        <div class="pagination-info">
            <span data-ru="Всего товаров" data-en="Total items">Всего товаров</span>:
            <span th:text="${totalItems}"></span>,
            <span data-ru="страница" data-en="page">страница</span> <span th:text="${currentPage}"></span>
            <span data-ru="из" data-en="of">из</span> <span th:text="${totalPages}"></span>
        </div>
        <a th:if="${currentPage > 1}" th:href="@{/shop(page=${currentPage - 1})}" class="page-btn">
            ← <span data-ru="Назад" data-en="Back">Назад</span>
        </a>
        <span th:if="${currentPage <= 1}" class="page-btn disabled">
            ← <span data-ru="Назад" data-en="Back">Назад</span>
        </span>
        <a th:each="i : ${#numbers.sequence(1, totalPages)}" th:href="@{/shop(page=${i})}"
           class="page-btn" th:classappend="${i == currentPage} ? 'active' : ''" th:text="${i}"></a>
        <a th:if="${currentPage < totalPages}" th:href="@{/shop(page=${currentPage + 1})}" class="page-btn">
            <span data-ru="Вперед" data-en="Next">Вперед</span> →
        </a>
        <span th:if="${currentPage >= totalPages}" class="page-btn disabled">
            <span data-ru="Вперед" data-en="Next">Вперед</span> →
        </span>
    </div>
</div>

<div th:replace="~{fragments/settings :: settings}"></div>

<script>
    document.querySelectorAll('.card .photo-slider').forEach(function (slider) {
        const card = slider.closest('.card');
        if (!card) return;
        const nameEl = card.querySelector('.card-name');
        const descEl = card.querySelector('.card-desc');
        const priceEl = card.querySelector('.card-price');
        const numberEl = card.querySelector('span[style*="background:#00b894"]');
        const info = {
            name: nameEl ? nameEl.textContent.trim() : '',
            number: numberEl ? numberEl.textContent.trim() : '',
            description: descEl ? descEl.textContent.trim() : '',
            price: priceEl ? priceEl.textContent.trim().replace(/\s*₽\s*$/, '') : ''
        };
        slider.setAttribute('data-viewer-info', JSON.stringify(info));
    });
</script>

</body>
</html>
