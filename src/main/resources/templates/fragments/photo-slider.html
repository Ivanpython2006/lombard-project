<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--Фрагмент: photo-slider параметры: photos (List<String>) alt (String) height (int, px)-->
<th:block th:fragment="slider(photos, alt, height)">
    <div class="photo-slider"
         th:attr="data-count=${photos != null ? #lists.size(photos) : 0}">

        <div th:if="${photos == null or #lists.isEmpty(photos)}"
             class="photo-slider-empty"
             th:style="'height:' + (${height} ?: 280) + 'px;'">
            <svg class="photo-empty-icon" viewBox="0 0 24 24" width="48" height="48"
                 fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="6" width="18" height="14" rx="2"/>
                <circle cx="12" cy="13" r="3.5"/>
                <path d="M8 6l1.5-2h5L16 6"/>
            </svg>
            <span data-ru="Нет фото" data-en="No photo">Нет фото</span>
        </div>

        <div th:unless="${photos == null or #lists.isEmpty(photos)}"
             class="photo-slider-inner"
             th:style="'height:' + (${height} ?: 280) + 'px;'">

            <img class="photo-slider-img"
                 th:each="u, it : ${photos}"
                 th:src="${u}"
                 th:attr="data-index=${it.index}"
                 th:classappend="${it.index == 0} ? 'active' : ''"
                 th:alt="${alt} ?: 'photo'"
                 onerror="handleBrokenPhoto(this)"
                 loading="lazy"/>

            <button th:if="${#lists.size(photos) > 1}"
                    type="button"
                    class="photo-slider-btn photo-slider-prev"
                    onclick="slidePhoto(this, -1); return false;"
                    aria-label="Назад">‹</button>

            <button th:if="${#lists.size(photos) > 1}"
                    type="button"
                    class="photo-slider-btn photo-slider-next"
                    onclick="slidePhoto(this, 1); return false;"
                    aria-label="Вперёд">›</button>

            <div th:if="${#lists.size(photos) > 1}"
                 class="photo-slider-counter">
                <span class="photo-slider-current">1</span>
                <span> / </span>
                <span th:text="${#lists.size(photos)}">1</span>
            </div>

            <div class="photo-slider-zoomhint"
                 data-ru="Нажмите, чтобы увеличить"
                 data-en="Click to enlarge">Нажмите, чтобы увеличить</div>
        </div>
    </div>
</th:block>

<th:block th:fragment="sliderStyles">
    <style>
        .photo-slider {
            position: relative;
            display: block;
            width: 100%;
        }
        .photo-slider-inner {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #f8f9fa;
        }
        .photo-slider-empty {
            width: 100%;
            background: #f8f9fa;
            border: 2px dashed #d0d0d0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #999;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .photo-empty-icon {
            color: #bbb;
            stroke-width: 1.5;
        }

        .photo-slider-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #ffffff;
            display: none;
            cursor: zoom-in;
        }
        .photo-slider-img.active { display: block; }
        .photo-slider-img.broken { display: none !important; }

        .photo-slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
            z-index: 3;
            font-family: inherit;
            padding-bottom: 4px;
            user-select: none;
        }
        .photo-slider-btn:hover { background: rgba(0, 0, 0, 0.8); }
        .photo-slider-prev { left: 10px; }
        .photo-slider-next { right: 10px; }

        .photo-slider-counter {
            position: absolute;
            bottom: 10px;
            right: 10px;
            padding: 4px 12px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 12px;
            z-index: 3;
            font-family: 'Inter', sans-serif;
        }

        .photo-slider-zoomhint {
            position: absolute;
            bottom: 10px;
            left: 10px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }
        .photo-slider-inner:hover .photo-slider-zoomhint { opacity: 1; }

        body.theme-dark .photo-slider-inner { background: #1e1e1e; }
        body.theme-dark .photo-slider-img { background: #1e1e1e; }
        body.theme-dark .photo-slider-empty {
            background: #1e1e1e;
            border-color: #2a2a2a;
            color: #666;
        }
        body.theme-dark .photo-empty-icon { color: #444; }

        @media (max-width: 600px) {
            .photo-slider-btn { width: 34px; height: 34px; font-size: 22px; }
            .photo-slider-prev { left: 6px; }
            .photo-slider-next { right: 6px; }
            .photo-slider-zoomhint { display: none; }
        }
    </style>
</th:block>

</body>
</html>
