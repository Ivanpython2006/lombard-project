<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Settings</title></head>
<body>

<div th:fragment="settings" id="settingsWidget">

    <div th:if="${success}" th:text="${success}" id="flashSuccess" style="display:none;"></div>
    <div th:if="${error}" th:text="${error}" id="flashError" style="display:none;"></div>
    <div th:if="${info}" th:text="${info}" id="flashInfo" style="display:none;"></div>

    <div id="toastContainer" class="toast-container"></div>

    <div id="confirmModal" class="confirm-modal">
        <div class="confirm-box">
            <div class="confirm-title" data-ru="Подтвердите действие" data-en="Confirm action">Подтвердите действие</div>
            <div class="confirm-text" id="confirmText">Вы уверены?</div>
            <div class="confirm-actions">
                <button type="button" class="confirm-btn cancel" onclick="closeConfirm()"
                        data-ru="Отмена" data-en="Cancel">Отмена</button>
                <button type="button" class="confirm-btn danger" id="confirmOk"
                        data-ru="Да" data-en="Yes">Да</button>
            </div>
        </div>
    </div>

    <div id="customCal" class="custom-cal" style="display:none;">
        <div class="cal-header">
            <button type="button" class="cal-nav" id="calPrev">‹</button>
            <span class="cal-title" id="calTitle">Январь 2025</span>
            <button type="button" class="cal-nav" id="calNext">›</button>
        </div>
        <div class="cal-weekdays">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>
        <div class="cal-days" id="calDays"></div>
        <div class="cal-footer">
            <button type="button" class="cal-clear" id="calClear">Удалить</button>
            <button type="button" class="cal-today" id="calToday">Сегодня</button>
        </div>
    </div>

    <div id="photoViewer" class="photo-viewer">
        <button type="button" class="photo-viewer-close" onclick="closePhotoViewer()" aria-label="Закрыть">&times;</button>
        <button type="button" class="photo-viewer-prev" onclick="viewerStep(-1)" aria-label="Назад">‹</button>
        <button type="button" class="photo-viewer-next" onclick="viewerStep(1)" aria-label="Вперёд">›</button>

        <div class="photo-viewer-stage" id="viewerStage">
            <img id="viewerImg" class="photo-viewer-img" src="" alt=""/>
        </div>

        <div class="photo-viewer-zoom">
            <button type="button" onclick="viewerZoom(-0.25)" title="-">−</button>
            <span class="zoom-label" id="viewerZoomLabel" onclick="viewerResetZoom()" title="Сбросить">100%</span>
            <button type="button" onclick="viewerZoom(0.25)" title="+">+</button>
        </div>

        <div class="photo-viewer-info" id="viewerInfo">
            <div class="info-title" id="viTitle">—</div>
            <div class="info-number" id="viNumber">—</div>

            <div class="info-row" id="viDescRow">
                <span class="info-label" data-ru="Описание" data-en="Description">Описание</span>
                <span class="info-value" id="viDesc">—</span>
            </div>

            <div class="info-row" id="viPriceRow">
                <span class="info-label" data-ru="Цена" data-en="Price">Цена</span>
                <span class="info-value" id="viPrice">—</span>
            </div>

            <div class="info-row" id="viClientRow" style="display:none;">
                <span class="info-label" data-ru="Клиент" data-en="Client">Клиент</span>
                <span class="info-value" id="viClient">—</span>
            </div>
            <div class="info-row" id="viLoanRow" style="display:none;">
                <span class="info-label" data-ru="Заём" data-en="Loan">Заём</span>
                <span class="info-value" id="viLoan">—</span>
            </div>
            <div class="info-row" id="viStatusRow" style="display:none;">
                <span class="info-label" data-ru="Статус" data-en="Status">Статус</span>
                <span class="info-value" id="viStatus">—</span>
            </div>

            <div class="info-actions" id="viActions"></div>
        </div>
    </div>

    <script>
        (function(){
            'use strict';

            const LANG_KEY = 'app_lang';

            function showToast(message, type) {
                type = type || 'info';
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('hide');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
            window.showToast = showToast;

            let confirmUrl = null;
            let confirmForm = null;
            function openConfirm(url, text, buttonText) {
                confirmUrl = url;
                confirmForm = null;
                document.getElementById('confirmText').textContent = text || 'Вы уверены?';
                document.getElementById('confirmOk').textContent = buttonText || 'Да';
                document.getElementById('confirmModal').classList.add('active');
                return false;
            }
            function openConfirmForm(form, text, buttonText) {
                confirmForm = form;
                confirmUrl = null;
                document.getElementById('confirmText').textContent = text || 'Вы уверены?';
                document.getElementById('confirmOk').textContent = buttonText || 'Да';
                document.getElementById('confirmModal').classList.add('active');
                return false;
            }
            function closeConfirm() {
                document.getElementById('confirmModal').classList.remove('active');
                confirmUrl = null;
                confirmForm = null;
            }
            window.openConfirm = openConfirm;
            window.openConfirmForm = openConfirmForm;
            window.closeConfirm = closeConfirm;

            window.slidePhoto = function(btn, dir) {
                const slider = btn.closest('.photo-slider');
                if (!slider) return;
                const imgs = slider.querySelectorAll('.photo-slider-img');
                if (imgs.length < 2) return;
                let current = 0;
                imgs.forEach((img, i) => { if (img.classList.contains('active')) current = i; });
                imgs[current].classList.remove('active');
                current = (current + dir + imgs.length) % imgs.length;
                imgs[current].classList.add('active');
                const counter = slider.querySelector('.photo-slider-current');
                if (counter) counter.textContent = (current + 1);
            };

            window.handleBrokenPhoto = function(img) {
                if (!img) return;
                img.classList.add('broken');
                img.classList.remove('active');

                const slider = img.closest('.photo-slider');
                if (!slider) return;

                const all = slider.querySelectorAll('.photo-slider-img');
                const anyOk = Array.from(all).some(i => !i.classList.contains('broken'));

                if (!anyOk) {
                    const inner = slider.querySelector('.photo-slider-inner');
                    if (inner) {
                        inner.innerHTML =
                            '<div class="photo-slider-empty" style="height:100%;">' +
                                '<svg class="photo-empty-icon" viewBox="0 0 24 24" width="48" height="48" ' +
                                     'fill="none" stroke="currentColor" stroke-width="1.5" ' +
                                     'stroke-linecap="round" stroke-linejoin="round">' +
                                    '<rect x="3" y="6" width="18" height="14" rx="2"/>' +
                                    '<circle cx="12" cy="13" r="3.5"/>' +
                                    '<path d="M8 6l1.5-2h5L16 6"/>' +
                                '</svg>' +
                                '<span>Нет фото</span>' +
                            '</div>';
                    }
                } else {
                    const next = Array.from(all).find(i => !i.classList.contains('broken'));
                    if (next) {
                        next.classList.add('active');
                        const idx = Array.from(all).indexOf(next) + 1;
                        const counter = slider.querySelector('.photo-slider-current');
                        if (counter) counter.textContent = idx;
                    }
                }
            };

            let viewerPhotos = [];
            let viewerIndex = 0;
            let viewerInfoData = null;
            let viewerScale = 1;
            let viewerTx = 0;
            let viewerTy = 0;
            let dragStart = null;

            function applyViewerTransform() {
                const img = document.getElementById('viewerImg');
                if (!img) return;
                img.style.transform = 'translate(' + viewerTx + 'px, ' + viewerTy + 'px) scale(' + viewerScale + ')';
                const lbl = document.getElementById('viewerZoomLabel');
                if (lbl) lbl.textContent = Math.round(viewerScale * 100) + '%';
            }
            function showViewerPhoto() {
                const img = document.getElementById('viewerImg');
                if (!img || !viewerPhotos.length) return;
                img.src = viewerPhotos[viewerIndex];
                viewerScale = 1;
                viewerTx = 0;
                viewerTy = 0;
                applyViewerTransform();
                const prev = document.querySelector('.photo-viewer-prev');
                const next = document.querySelector('.photo-viewer-next');
                const many = viewerPhotos.length > 1;
                prev.style.display = many ? '' : 'none';
                next.style.display = many ? '' : 'none';
            }
            window.openPhotoViewer = function(photos, startIndex, info) {
                if (!photos || !photos.length) return;
                viewerPhotos = photos.slice();
                viewerIndex = Math.min(Math.max(0, startIndex | 0), photos.length - 1);
                viewerInfoData = info || null;
                document.getElementById('photoViewer').classList.add('active');
                document.body.style.overflow = 'hidden';
                renderViewerInfo();
                showViewerPhoto();
            };
            window.closePhotoViewer = function() {
                document.getElementById('photoViewer').classList.remove('active');
                document.body.style.overflow = '';
                viewerPhotos = [];
                viewerInfoData = null;
            };
            window.viewerStep = function(dir) {
                if (viewerPhotos.length < 2) return;
                viewerIndex = (viewerIndex + dir + viewerPhotos.length) % viewerPhotos.length;
                showViewerPhoto();
            };
            window.viewerZoom = function(delta) {
                viewerScale = Math.min(5, Math.max(0.25, viewerScale + delta));
                applyViewerTransform();
            };
            window.viewerResetZoom = function() {
                viewerScale = 1;
                viewerTx = 0;
                viewerTy = 0;
                applyViewerTransform();
            };

            function escapeHtml(s) {
                if (s === null || s === undefined) return '';
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function renderViewerInfo() {
                const info = viewerInfoData;
                const set = (id, val, empty) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (val === null || val === undefined || val === '' || val === 'null') {
                        el.textContent = empty || '—';
                    } else {
                        el.textContent = val;
                    }
                };

                const showLoanRows = !!(info && (info.loanId || info.client));

                document.getElementById('viClientRow').style.display = showLoanRows ? '' : 'none';
                document.getElementById('viLoanRow').style.display = showLoanRows ? '' : 'none';
                document.getElementById('viStatusRow').style.display = showLoanRows ? '' : 'none';

                if (!info) {
                    set('viTitle', '—');
                    set('viNumber', '—');
                    set('viPrice', '—');
                    set('viDesc', '—');
                    set('viClient', '—');
                    set('viLoan', '—');
                    set('viStatus', '—');
                    document.getElementById('viActions').innerHTML = '';
                    return;
                }
                set('viTitle', info.name, '—');
                set('viNumber', info.number, '—');
                set('viPrice', info.price ? info.price + ' ₽' : '', '—');
                set('viDesc', info.description, 'Не указано');

                if (showLoanRows) {
                    set('viClient', info.client, '—');
                    set('viStatus', info.status, '—');
                    const loanEl = document.getElementById('viLoan');
                    if (info.loanId) {
                        const label = info.loanNumber || ('#' + info.loanId);
                        loanEl.innerHTML = '<a href="/loans/' + info.loanId + '">' + escapeHtml(label) + '</a>';
                    } else {
                        loanEl.textContent = '—';
                    }
                }

                const actions = document.getElementById('viActions');
                actions.innerHTML = '';
                if (info.editUrl) {
                    const a = document.createElement('a');
                    a.href = info.editUrl;
                    a.className = 'action-btn';
                    a.textContent = document.documentElement.lang === 'en' ? 'Edit' : 'Редактировать';
                    actions.appendChild(a);
                }
            }

            document.addEventListener('click', function(e) {
                if (e.target.closest && e.target.closest('.photo-slider-btn')) return;

                const img = e.target.closest && e.target.closest('.photo-slider-img');
                if (img && !img.classList.contains('broken')) {
                    const slider = img.closest('.photo-slider');
                    if (!slider) return;
                    const imgs = Array.from(slider.querySelectorAll('.photo-slider-img'))
                        .filter(i => !i.classList.contains('broken'));
                    const urls = imgs.map(i => i.src);
                    const idx = imgs.indexOf(img);
                    const info = slider.dataset.viewerInfo ? JSON.parse(slider.dataset.viewerInfo) : null;
                    openPhotoViewer(urls, idx, info);
                    return;
                }
                const thumbImg = e.target.closest && e.target.closest('.photo-thumb-block img, .photo-thumb img');
                if (thumbImg) {
                    const grid = thumbImg.closest('.photo-grid');
                    if (!grid) return;
                    const imgs = Array.from(grid.querySelectorAll('.photo-thumb-block img, .photo-thumb img'));
                    const urls = imgs.map(i => i.src);
                    const idx = imgs.indexOf(thumbImg);
                    let info = null;
                    if (grid.dataset && grid.dataset.viewerInfo) {
                        try { info = JSON.parse(grid.dataset.viewerInfo); } catch (err) { info = null; }
                    }
                    openPhotoViewer(urls, idx, info);
                }
            });

            document.addEventListener('keydown', function(e) {
                const v = document.getElementById('photoViewer');
                if (!v || !v.classList.contains('active')) return;
                if (e.key === 'Escape') closePhotoViewer();
                else if (e.key === 'ArrowLeft') viewerStep(-1);
                else if (e.key === 'ArrowRight') viewerStep(1);
                else if (e.key === '+' || e.key === '=') viewerZoom(0.25);
                else if (e.key === '-') viewerZoom(-0.25);
                else if (e.key === '0') viewerResetZoom();
            });

            const stage = document.getElementById('viewerStage');
            if (stage) {
                stage.addEventListener('wheel', function(e) {
                    e.preventDefault();
                    const delta = e.deltaY < 0 ? 0.15 : -0.15;
                    viewerZoom(delta);
                }, { passive: false });
                stage.addEventListener('mousedown', function(e) {
                    if (e.target.id !== 'viewerImg') return;
                    dragStart = { x: e.clientX - viewerTx, y: e.clientY - viewerTy };
                    e.preventDefault();
                });
                document.addEventListener('mousemove', function(e) {
                    if (!dragStart) return;
                    viewerTx = e.clientX - dragStart.x;
                    viewerTy = e.clientY - dragStart.y;
                    applyViewerTransform();
                });
                document.addEventListener('mouseup', function() { dragStart = null; });
                stage.addEventListener('click', function(e) {
                    if (e.target === stage) closePhotoViewer();
                });
            }

            const CAL_MONTHS = {
                ru: ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
                en: ['January','February','March','April','May','June','July','August','September','October','November','December']
            };
            const CAL_WEEKDAYS = {
                ru: ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],
                en: ['Mo','Tu','We','Th','Fr','Sa','Su']
            };
            const CAL_CLEAR  = { ru: 'Удалить', en: 'Clear' };
            const CAL_TODAY  = { ru: 'Сегодня', en: 'Today' };
            let calCurrent = new Date();
            let calSelected = null;
            let calTargetInput = null;
            function getCalLang(){ return localStorage.getItem(LANG_KEY) || 'ru'; }
            function renderCalendar(){
                const cal = document.getElementById('customCal');
                if (!cal) return;
                const lang = getCalLang();
                document.getElementById('calTitle').textContent =
                    CAL_MONTHS[lang][calCurrent.getMonth()] + ' ' + calCurrent.getFullYear();
                const wd = cal.querySelectorAll('.cal-weekdays span');
                CAL_WEEKDAYS[lang].forEach((d, i) => { if (wd[i]) wd[i].textContent = d; });
                document.getElementById('calClear').textContent = CAL_CLEAR[lang];
                document.getElementById('calToday').textContent = CAL_TODAY[lang];
                const daysBox = document.getElementById('calDays');
                daysBox.innerHTML = '';
                const year  = calCurrent.getFullYear();
                const month = calCurrent.getMonth();
                const first = new Date(year, month, 1);
                const last  = new Date(year, month + 1, 0);
                const today = new Date();
                let startOffset = first.getDay() - 1;
                if (startOffset < 0) startOffset = 6;
                const prevLast = new Date(year, month, 0).getDate();
                for (let i = startOffset - 1; i >= 0; i--) {
                    const el = document.createElement('div');
                    el.className = 'cal-day other-month';
                    el.textContent = prevLast - i;
                    daysBox.appendChild(el);
                }
                for (let d = 1; d <= last.getDate(); d++) {
                    const el = document.createElement('div');
                    el.className = 'cal-day';
                    el.textContent = d;
                    if (d === today.getDate() && month === today.getMonth() && year === today.getFullYear())
                        el.classList.add('today');
                    if (calSelected && d === calSelected.day && month === calSelected.month && year === calSelected.year)
                        el.classList.add('selected');
                    el.addEventListener('click', () => {
                        calSelected = { day: d, month: month, year: year };
                        const dd = String(d).padStart(2,'0');
                        const mm = String(month+1).padStart(2,'0');
                        if (calTargetInput) calTargetInput.value = dd + '.' + mm + '.' + year;
                        closeCalendar();
                    });
                    daysBox.appendChild(el);
                }
                const need = 42 - daysBox.children.length;
                for (let d = 1; d <= need; d++) {
                    const el = document.createElement('div');
                    el.className = 'cal-day other-month';
                    el.textContent = d;
                    daysBox.appendChild(el);
                }
            }
            function openCalendar(input){
                calTargetInput = input;
                if (input.value && /^\d{2}\.\d{2}\.\d{4}$/.test(input.value)) {
                    const parts = input.value.split('.').map(Number);
                    calSelected = { day: parts[0], month: parts[1] - 1, year: parts[2] };
                    calCurrent = new Date(parts[2], parts[1] - 1, 1);
                } else {
                    calSelected = null;
                    calCurrent = new Date();
                }
                renderCalendar();
                const cal = document.getElementById('customCal');
                const rect = input.getBoundingClientRect();
                cal.style.display = 'block';
                cal.style.top  = (rect.bottom + window.scrollY + 4) + 'px';
                cal.style.left = (rect.left + window.scrollX) + 'px';
            }
            function closeCalendar(){
                const cal = document.getElementById('customCal');
                if (cal) cal.style.display = 'none';
                calTargetInput = null;
            }
            function initCalendar(){
                const cal = document.getElementById('customCal');
                if (!cal) return;
                document.querySelectorAll('input[type="date"]').forEach(input => {
                    if (input.dataset.calBound) return;
                    input.dataset.calBound = '1';
                    input.type = 'text';
                    input.readOnly = true;
                    input.style.cursor = 'pointer';
                    input.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openCalendar(input);
                    });
                });
                document.getElementById('calPrev').addEventListener('click', () => {
                    calCurrent.setMonth(calCurrent.getMonth() - 1);
                    renderCalendar();
                });
                document.getElementById('calNext').addEventListener('click', () => {
                    calCurrent.setMonth(calCurrent.getMonth() + 1);
                    renderCalendar();
                });
                document.getElementById('calClear').addEventListener('click', () => {
                    if (calTargetInput) calTargetInput.value = '';
                    calSelected = null;
                    closeCalendar();
                });
                document.getElementById('calToday').addEventListener('click', () => {
                    const t = new Date();
                    calCurrent = new Date(t.getFullYear(), t.getMonth(), 1);
                    calSelected = { day: t.getDate(), month: t.getMonth(), year: t.getFullYear() };
                    if (calTargetInput) {
                        const dd = String(t.getDate()).padStart(2,'0');
                        const mm = String(t.getMonth()+1).padStart(2,'0');
                        calTargetInput.value = dd + '.' + mm + '.' + t.getFullYear();
                    }
                    closeCalendar();
                });
                document.addEventListener('click', (e) => {
                    if (!cal.contains(e.target) && !e.target.matches('input[type="date"]'))
                        closeCalendar();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeCalendar();
                });
            }

            function init(){
                initCalendar();

                const confirmOk = document.getElementById('confirmOk');
                if (confirmOk) {
                    confirmOk.addEventListener('click', function() {
                        if (confirmUrl) window.location.href = confirmUrl;
                        else if (confirmForm) confirmForm.submit();
                    });
                }
                const confirmModal = document.getElementById('confirmModal');
                if (confirmModal) {
                    confirmModal.addEventListener('click', function(e) {
                        if (e.target === this) closeConfirm();
                    });
                }
                const s = document.getElementById('flashSuccess');
                const er = document.getElementById('flashError');
                const inf = document.getElementById('flashInfo');
                if (s && s.textContent.trim()) showToast(s.textContent.trim(), 'success');
                if (er && er.textContent.trim()) showToast(er.textContent.trim(), 'error');
                if (inf && inf.textContent.trim()) showToast(inf.textContent.trim(), 'info');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</div>

</body>
</html>
