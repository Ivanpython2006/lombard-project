<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title data-ru="Создать заявку" data-en="Create Request">Создать заявку</title>
    <th:block th:replace="~{fragments/head :: styles}"></th:block>
    <style>
        .file-upload-wrap { position: relative; display: block; }
        .file-upload-input { position: absolute; left: -9999px; opacity: 0; }
        .file-upload-btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 12px 24px; font-size: 13px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: #00b894; background: #fff; border: 2px dashed #00b894;
            cursor: pointer; font-family: inherit; transition: all 0.15s ease;
        }
        .file-upload-btn:hover { background: #00b894; color: #fff; border-style: solid; }
        .file-upload-name { display: block; margin-top: 8px; font-size: 12px; color: #666; font-style: italic; }
        body.theme-dark .file-upload-btn { background: #1e1e1e; color: #00d4a8; border-color: #00d4a8; }
        body.theme-dark .file-upload-btn:hover { background: #00d4a8; color: #111; }
        body.theme-dark .file-upload-name { color: #999; }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content with-sidebar-center">
    <div class="form-container">
        <h2 data-ru="Сдать вещь в ломбард" data-en="Pawn an Item">Сдать вещь в ломбард</h2>

        <form th:action="@{/client/loans/new}" th:object="${loan}" method="post" id="loanForm"
              enctype="multipart/form-data">

            <h3 data-ru="Что вы хотите получить" data-en="What you want to get">Что вы хотите получить</h3>

            <div class="form-group">
                <label for="amount" data-ru="Желаемая сумма (₽)" data-en="Desired amount (₽)">Желаемая сумма (₽)</label>
                <input type="text" id="amount" placeholder="" inputmode="numeric" autocomplete="off" required>
                <input type="hidden" name="amount" id="amountHidden">
                <div class="hint"
                     data-ru="Итоговая сумма будет определена после оценки вещи."
                     data-en="The final amount will be determined after appraisal.">
                    Итоговая сумма будет определена после оценки вещи.
                </div>
                <div class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
            </div>

            <div class="form-group">
                <label for="months" data-ru="Срок займа (месяцев)" data-en="Loan term (months)">Срок займа (месяцев)</label>
                <input type="number" id="months" name="months" value="1" min="1" max="24" required>
                <div class="hint" data-ru="Максимум 24 месяца" data-en="Maximum 24 months">Максимум 24 месяца</div>
            </div>

            <h3 data-ru="Что вы сдаете" data-en="What you pawn">Что вы сдаете</h3>

            <div class="form-group">
                <label for="collateralName" data-ru="Название вещи" data-en="Item name">Название вещи</label>
                <input type="text" id="collateralName" name="collateralName" required maxlength="200">
            </div>

            <div class="form-group">
                <label for="collateralDescription" data-ru="Описание" data-en="Description">Описание</label>
                <textarea id="collateralDescription" name="collateralDescription"
                          data-ru="Состояние, комплектация, дефекты..."
                          data-en="Condition, package contents, defects..."
                          placeholder="Состояние, комплектация, дефекты..." required maxlength="2000"></textarea>
            </div>

            <div class="form-group">
                <label data-ru="Фото вещи" data-en="Item Photo">Фото вещи</label>

                <label class="file-upload-wrap" for="photos">
                    <input type="file" id="photos" name="photos"
                           accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple
                           class="file-upload-input"
                           onchange="showSelectedFiles(this)">
                    <span class="file-upload-btn">
                        <span data-ru="Выберите фото (можно несколько)" data-en="Choose Photos (multiple)">Выберите фото (можно несколько)</span>
                    </span>
                </label>
                <span class="file-upload-name" id="fileName"
                      data-ru="Файл не выбран" data-en="No file chosen">Файл не выбран</span>

                <div class="hint" style="margin-top: 8px;"
                     data-ru="JPG или PNG, до 5 МБ каждое. Можно прикрепить несколько фото."
                     data-en="JPG or PNG, up to 5 MB each. You can attach multiple photos.">
                    JPG или PNG, до 5 МБ каждое. Можно прикрепить несколько фото.
                </div>
            </div>

            <button type="submit" class="btn-green"
                    data-ru="Отправить заявку" data-en="Submit request">Отправить заявку</button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/settings :: settings}"></div>

<script>
    const amountInput = document.getElementById('amount');
    const amountHidden = document.getElementById('amountHidden');
    const form = document.getElementById('loanForm');

    function formatAmount(raw) {
        const digits = raw.replace(/\D/g, '');
        if (!digits) return '';
        return Number(digits).toLocaleString('ru-RU');
    }

    amountInput.addEventListener('input', function () {
        const formatted = formatAmount(this.value);
        this.value = formatted;
        amountHidden.value = formatted.replace(/\D/g, '');
    });

    const monthsInput = document.getElementById('months');
    monthsInput.addEventListener('input', function () {
        let v = parseInt(this.value, 10);
        if (isNaN(v)) return;
        if (v > 24) this.value = 24;
        if (v < 1) this.value = 1;
    });

    form.addEventListener('submit', function (e) {
        const digits = amountInput.value.replace(/\D/g, '');
        if (!digits || Number(digits) < 1) {
            e.preventDefault();
            const isEn = (localStorage.getItem('app_lang') === 'en');
            alert(isEn ? 'Enter desired amount (minimum 1 руб.)' : 'Введите желаемую сумму (минимум 1 руб.)');
            amountInput.focus();
            return false;
        }
        amountHidden.value = digits;

        const m = parseInt(monthsInput.value, 10);
        if (isNaN(m) || m < 1 || m > 24) {
            e.preventDefault();
            const isEn = (localStorage.getItem('app_lang') === 'en');
            alert(isEn ? 'Loan term must be from 1 to 24 months' : 'Срок займа должен быть от 1 до 24 месяцев');
            monthsInput.focus();
            return false;
        }
    });

    if (amountInput.value) {
        amountInput.value = formatAmount(amountInput.value);
        amountHidden.value = amountInput.value.replace(/\D/g, '');
    }

    function showSelectedFiles(input) {
        const nameEl = document.getElementById('fileName');
        if (!nameEl) return;
        const isEn = (localStorage.getItem('app_lang') === 'en');
        if (input.files && input.files.length > 0) {
            nameEl.textContent = (input.files.length === 1)
                ? input.files[0].name
                : (isEn ? 'Files selected: ' + input.files.length
                        : 'Выбрано файлов: ' + input.files.length);
            nameEl.style.color = '#00b894';
            nameEl.style.fontStyle = 'normal';
            nameEl.style.fontWeight = '600';
        } else {
            nameEl.textContent = isEn ? 'No file chosen' : 'Файл не выбран';
            nameEl.style.color = '#666';
            nameEl.style.fontStyle = 'italic';
            nameEl.style.fontWeight = 'normal';
        }
    }
</script>

</body>
</html>
