<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title data-ru="Займы" data-en="Loans">Займы</title>
    <th:block th:replace="~{fragments/head :: styles}"></th:block>
    <style>
        .loan-number-link {
            display: inline-block;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: 800;
            color: #00b894;
            text-decoration: none;
            border: 1px solid #00b894;
            background: #e6faf5;
            letter-spacing: 0.3px;
            transition: all 0.15s ease;
        }
        .loan-number-link:hover { background: #00b894; color: #fff; }
        body.theme-dark .loan-number-link { background: #0a2e27; color: #00d4a8; border-color: #00d4a8; }
        body.theme-dark .loan-number-link:hover { background: #00d4a8; color: #111; }

        .client-cell {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; flex-wrap: nowrap;
        }
        .client-cell .client-link {
            color: #000; text-decoration: none;
            border-bottom: 1px dashed #bbb;
            transition: all 0.15s ease;
            font-size: 14px; font-weight: 700; white-space: nowrap;
        }
        .client-cell .client-link:hover { color: #00b894; border-bottom-color: #00b894; border-bottom-style: solid; }
        .client-cell .client-number { font-size: 12px; color: #00b894; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; }
        body.theme-dark .client-cell .client-link { color: #e0e0e0; border-bottom-color: #555; }
        body.theme-dark .client-cell .client-link:hover { color: #00d4a8; border-bottom-color: #00d4a8; }
        body.theme-dark .client-cell .client-number { color: #00d4a8; }

        .item-cell {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; flex-wrap: nowrap;
        }
        .item-cell .item-link {
            color: #000; text-decoration: none;
            border-bottom: 1px dashed #bbb;
            transition: all 0.15s ease;
            font-size: 14px; font-weight: 700; white-space: nowrap;
            background: none; border-top: none; border-left: none; border-right: none;
            padding: 0; cursor: pointer; font-family: inherit;
        }
        .item-cell .item-link:hover { color: #00b894; border-bottom-color: #00b894; border-bottom-style: solid; }
        .item-cell .item-number { font-size: 12px; color: #00b894; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; }
        body.theme-dark .item-cell .item-link { color: #e0e0e0; border-bottom-color: #555; }
        body.theme-dark .item-cell .item-link:hover { color: #00d4a8; border-bottom-color: #00d4a8; }
        body.theme-dark .item-cell .item-number { color: #00d4a8; }

        /* Красивое троеточие в поиске */
        .filter-bar input[type="text"] {
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content with-sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; flex-wrap:wrap; gap:12px;">
        <h2 style="margin-bottom:0;" data-ru="Все займы" data-en="All Loans">Все займы</h2>
        <a href="/loans/export" class="btn" data-ru="Экспорт CSV" data-en="Export CSV">Экспорт CSV</a>
    </div>

    <form class="filter-bar" th:action="@{/loans}" method="get" id="filterForm">
        <input type="text" name="clientName" th:value="${clientName}"
               data-ru="Поиск по номеру займа, имени или номеру клиента..."
               data-en="Search by loan number, name or client number..."
               placeholder="Поиск по номеру займа, имени или номеру клиента..."
               oninput="autoSubmit()">
        <span class="filter-divider"></span>
        <select name="status" onchange="this.form.submit()">
            <option value="" th:selected="${status == null or status.isEmpty()}" data-ru="Все статусы" data-en="All statuses">Все статусы</option>
            <option value="В ожидании" th:selected="${status == 'В ожидании'}" data-ru="В ожидании" data-en="Pending">В ожидании</option>
            <option value="Ожидает подтверждения" th:selected="${status == 'Ожидает подтверждения'}" data-ru="Ожидает подтверждения" data-en="Awaiting Confirmation">Ожидает подтверждения</option>
            <option value="Одобрен" th:selected="${status == 'Одобрен'}" data-ru="Одобрен" data-en="Approved">Одобрен</option>
            <option value="Отклонен" th:selected="${status == 'Отклонен'}" data-ru="Отклонен" data-en="Rejected">Отклонен</option>
            <option value="Выдан" th:selected="${status == 'Выдан'}" data-ru="Выдан" data-en="Issued">Выдан</option>
            <option value="Закрыт" th:selected="${status == 'Закрыт'}" data-ru="Закрыт" data-en="Closed">Закрыт</option>
            <option value="На продаже" th:selected="${status == 'На продаже'}" data-ru="В магазине" data-en="In Shop">В магазине</option>
            <option value="Отменена" th:selected="${status == 'Отменена'}" data-ru="Отменена" data-en="Cancelled">Отменена</option>
            <option value="На складе" th:selected="${status == 'На складе'}" data-ru="На складе" data-en="In Stock">На складе</option>
            <option value="Куплен" th:selected="${status == 'Куплен'}" data-ru="Куплен" data-en="Purchased">Куплен</option>
        </select>
        <span class="filter-divider"></span>
        <select name="sort" onchange="this.form.submit()">
            <option value="id" th:selected="${sort == 'id'}" data-ru="Сначала новые" data-en="Newest first">Сначала новые</option>
            <option value="date_asc" th:selected="${sort == 'date_asc'}" data-ru="Сначала старые" data-en="Oldest first">Сначала старые</option>
            <option value="amount_desc" th:selected="${sort == 'amount_desc'}" data-ru="По сумме (убыв.)" data-en="By amount (desc)">По сумме (убыв.)</option>
            <option value="amount_asc" th:selected="${sort == 'amount_asc'}" data-ru="По сумме (возр.)" data-en="By amount (asc)">По сумме (возр.)</option>
            <option value="status" th:selected="${sort == 'status'}" data-ru="По статусу" data-en="By status">По статусу</option>
        </select>
    </form>

    <div class="table-wrap" th:if="${not #lists.isEmpty(loans)}">
        <table id="loansTable">
            <thead>
            <tr>
                <th data-ru="Номер" data-en="Number">Номер</th>
                <th data-ru="Клиент" data-en="Client">Клиент</th>
                <th data-ru="Вещь" data-en="Item">Вещь</th>
                <th data-ru="Статус" data-en="Status">Статус</th>
                <th data-ru="Запрошено" data-en="Requested">Запрошено</th>
                <th data-ru="Одобрено" data-en="Approved">Одобрено</th>
                <th data-ru="Ставка" data-en="Rate">Ставка</th>
                <th data-ru="Вернуть до" data-en="Due Date">Вернуть до</th>
                <th data-ru="Действия" data-en="Actions">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="loan : ${loans}" th:classappend="${loan.overdue} ? 'overdue' : ''">
                <td>
                    <a th:href="@{/loans/{id}(id=${loan.id})}"
                       class="loan-number-link"
                       th:text="${loan.loanNumber}">L71533</a>
                </td>
                <td>
                    <div class="client-cell" th:if="${loan.client != null}">
                        <a th:href="@{/client/search(query=${loan.client.fullName})}"
                           class="client-link" th:text="${loan.client.fullName}"></a>
                        <span class="client-number" th:text="'(' + ${loan.client.clientNumber} + ')'"></span>
                    </div>
                    <span th:if="${loan.client == null}">-</span>
                </td>
                <td>
                    <div class="item-cell" th:if="${not #lists.isEmpty(loan.collaterals)}">
                        <button type="button" class="item-link"
                                th:attr="data-id=${loan.id}"
                                onclick="openLoan(this)"
                                th:text="${loan.collaterals[0].name}"></button>
                        <span class="item-number" th:text="'(' + ${loan.collaterals[0].itemNumber} + ')'"></span>
                    </div>
                    <span th:if="${#lists.isEmpty(loan.collaterals)}">-</span>
                </td>
                <td>
                    <span class="status-badge status-waiting" th:if="${loan.status == 'В ожидании'}"
                          data-ru="В ожидании" data-en="Pending">В ожидании</span>
                    <span class="status-badge status-waiting" th:if="${loan.status == 'Ожидает подтверждения'}"
                          data-ru="Ожидает подтверждения" data-en="Awaiting Confirmation">Ожидает подтверждения</span>
                    <span class="status-badge status-approved" th:if="${loan.status == 'Одобрен'}"
                          data-ru="Одобрен" data-en="Approved">Одобрен</span>
                    <span class="status-badge status-rejected" th:if="${loan.status == 'Отклонен'}"
                          data-ru="Отклонен" data-en="Rejected">Отклонен</span>
                    <span class="status-badge status-issued" th:if="${loan.status == 'Выдан'}"
                          data-ru="Выдан" data-en="Issued">Выдан</span>
                    <span class="status-badge status-closed" th:if="${loan.status == 'Закрыт'}"
                          data-ru="Закрыт" data-en="Closed">Закрыт</span>
                    <span class="status-badge status-sold" th:if="${loan.status == 'На продаже'}"
                          data-ru="В магазине" data-en="In Shop">В магазине</span>
                    <span class="status-badge status-cancelled-loan" th:if="${loan.status == 'Отменена'}"
                          data-ru="Отменена" data-en="Cancelled">Отменена</span>
                    <span class="status-badge status-overdue" th:if="${loan.status == 'Просрочен'}"
                          data-ru="Просрочен" data-en="Overdue">Просрочен</span>
                    <span class="status-badge status-instock" th:if="${loan.status == 'На складе'}"
                          data-ru="На складе" data-en="In Stock">На складе</span>
                    <span class="status-badge status-purchased" th:if="${loan.status == 'Куплен'}"
                          data-ru="Куплен" data-en="Purchased">Куплен</span>
                </td>
                <td th:text="${loan.amount} + ' ₽'"></td>
                <td th:text="${loan.agreedAmount != null ? loan.agreedAmount : loan.amount} + ' ₽'"></td>
                <td th:text="${loan.rate != null} ? ${loan.rate} + ' %' : '-'"></td>
                <td th:text="${loan.dueDate} ?: '-'"></td>
                <td>
                    <div style="display:flex; justify-content:center; align-items:center;">
                        <form th:if="${isAdminOrManager}"
                              th:action="@{/loans/{id}/delete(id=${loan.id})}"
                              method="post"
                              style="display:inline; margin:0;"
                              onsubmit="return openConfirmForm(this, 'Удалить этот заем?', 'Удалить')">
                            <input type="hidden" name="page" th:value="${currentPage}">
                            <input type="hidden" name="sort" th:value="${sort}">
                            <input type="hidden" name="status" th:value="${status}">
                            <input type="hidden" name="clientName" th:value="${clientName}">
                            <button type="submit" class="btn-red"
                                    style="padding:6px 14px; font-size:12px;"
                                    data-ru="Удалить" data-en="Delete">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-message" th:if="${#lists.isEmpty(loans)}"
         data-ru="Займов не найдено." data-en="No loans found.">
        Займов не найдено.
    </div>

    <div class="pagination-wrap" th:if="${totalPages != null and totalPages > 1}">
        <div class="pagination-info">
            <span data-ru="Всего займов" data-en="Total loans">Всего займов</span>:
            <span th:text="${totalItems}"></span>,
            <span data-ru="страница" data-en="page">страница</span>
            <span th:text="${currentPage}"></span>
            <span data-ru="из" data-en="of">из</span>
            <span th:text="${totalPages}"></span>
        </div>

        <a th:if="${currentPage > 1}"
           th:href="@{/loans(page=${currentPage - 1}, sort=${sort}, status=${status}, clientName=${clientName})}"
           class="page-btn">
            ← <span data-ru="Назад" data-en="Back">Назад</span>
        </a>
        <span th:if="${currentPage <= 1}" class="page-btn disabled">
            ← <span data-ru="Назад" data-en="Back">Назад</span>
        </span>

        <a th:each="i : ${#numbers.sequence(1, totalPages)}"
           th:href="@{/loans(page=${i}, sort=${sort}, status=${status}, clientName=${clientName})}"
           class="page-btn"
           th:classappend="${i == currentPage} ? 'active' : ''"
           th:text="${i}"></a>

        <a th:if="${currentPage < totalPages}"
           th:href="@{/loans(page=${currentPage + 1}, sort=${sort}, status=${status}, clientName=${clientName})}"
           class="page-btn">
            <span data-ru="Вперед" data-en="Next">Вперед</span> →
        </a>
        <span th:if="${currentPage >= totalPages}" class="page-btn disabled">
            <span data-ru="Вперед" data-en="Next">Вперед</span> →
        </span>
    </div>
</div>

<div th:replace="~{fragments/settings :: settings}"></div>

<script>
    let autoSubmitTimer = null;
    function autoSubmit() {
        clearTimeout(autoSubmitTimer);
        autoSubmitTimer = setTimeout(function() {
            document.getElementById('filterForm').submit();
        }, 500);
    }
    function openLoan(btn) {
        const id = btn.getAttribute('data-id');
        if (id) window.location.href = '/loans/' + id;
    }
</script>

</body>
</html>
