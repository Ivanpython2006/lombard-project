<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title data-ru="Смена пароля" data-en="Change Password">Смена пароля</title>
    <th:block th:replace="~{fragments/head :: styles}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content with-sidebar-center">
    <div class="form-container" style="max-width:500px;">
        <h2 data-ru="Смена пароля" data-en="Change Password">Смена пароля</h2>
        <p class="subtitle"
           data-ru="Введите текущий пароль и новый пароль"
           data-en="Enter your current password and the new one">
            Введите текущий пароль и новый пароль
        </p>

        <form th:action="@{/profile/password}" method="post">
            <div class="form-group">
                <label for="currentPassword" data-ru="Текущий пароль" data-en="Current password">Текущий пароль</label>
                <input type="password" id="currentPassword" name="currentPassword"
                       data-ru="Введите текущий пароль" data-en="Enter current password"
                       placeholder="Введите текущий пароль" required autofocus>
            </div>
            <div class="form-group">
                <label for="newPassword" data-ru="Новый пароль" data-en="New password">Новый пароль</label>
                <input type="password" id="newPassword" name="newPassword"
                       data-ru="Минимум 6 символов" data-en="At least 6 characters"
                       placeholder="Минимум 6 символов" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword" data-ru="Повторите новый пароль" data-en="Repeat new password">Повторите новый пароль</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       data-ru="Повторите пароль" data-en="Repeat password"
                       placeholder="Повторите пароль" minlength="6" required>
            </div>
            <button type="submit" class="btn-green"
                    data-ru="Сменить пароль" data-en="Change Password">Сменить пароль</button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/settings :: settings}"></div>
</body>
</html>
