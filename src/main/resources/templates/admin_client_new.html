<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title data-ru="Новый клиент" data-en="New Client">Новый клиент</title>
    <th:block th:replace="~{fragments/head :: styles}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content with-sidebar-center">
    <div class="form-container mw-500">
        <h2 data-ru="Новый клиент" data-en="New Client">Новый клиент</h2>

        <div class="alert alert-error alert-form" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/admin/clients/new}" method="post">
            <div class="form-group">
                <label for="lastName" data-ru="Фамилия" data-en="Last Name">Фамилия</label>
                <input type="text" id="lastName" name="lastName" required
                       data-ru="Введите фамилию" data-en="Enter last name"
                       placeholder="Иванов" autofocus
                       pattern="[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z\-]+"
                       title="Только буквы, минимум 2 символа"
                       minlength="2" maxlength="40">
            </div>

            <div class="form-group">
                <label for="firstName" data-ru="Имя" data-en="First Name">Имя</label>
                <input type="text" id="firstName" name="firstName" required
                       data-ru="Введите имя" data-en="Enter first name"
                       placeholder="Иван"
                       pattern="[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z\-]+"
                       title="Только буквы, минимум 2 символа"
                       minlength="2" maxlength="40">
            </div>

            <div class="form-group">
                <label for="middleName" data-ru="Отчество" data-en="Middle Name">Отчество</label>
                <input type="text" id="middleName" name="middleName"
                       data-ru="Введите отчество" data-en="Enter middle name"
                       placeholder="Иванович"
                       pattern="[А-ЯЁа-яёA-Za-z][А-ЯЁа-яёA-Za-z\-]+"
                       title="Только буквы, минимум 2 символа"
                       minlength="2" maxlength="40">
            </div>

            <div class="form-group">
                <label for="email" data-ru="Email" data-en="Email">Email</label>
                <input type="email" id="email" name="email"
                       data-ru="Введите email" data-en="Enter email"
                       placeholder="client@example.com"
                       maxlength="80">
            </div>

            <div class="form-group">
                <label for="phone" data-ru="Телефон" data-en="Phone">Телефон</label>
                <input type="tel" id="phone" name="phone" required
                       data-ru="Введите телефон" data-en="Enter phone"
                       placeholder="+79875102333"
                       pattern="\+7\d{10}">
                <div class="hint" data-ru="Формат: +7XXXXXXXXXX (11 цифр)"
                     data-en="Format: +7XXXXXXXXXX (11 digits)">Формат: +7XXXXXXXXXX (11 цифр)</div>
            </div>

            <button type="submit" class="btn-green"
                    data-ru="Создать клиента" data-en="Create Client">Создать клиента</button>
        </form>

        <a href="/client/search" class="btn-back d-block w-fit mx-auto-mt-20"
           data-ru="← Назад к клиентам" data-en="← Back to Clients">← Назад к клиентам</a>
    </div>
</div>

<div th:replace="~{fragments/settings :: settings}"></div>
</body>
</html>
