<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title data-ru="Оценка и одобрение" data-en="Valuation and Approval">Оценка и одобрение</title>
    <th:block th:replace="~{fragments/head :: styles}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content with-sidebar-center">
    <div class="form-container">
        <h2>
            <span data-ru="Оценка и одобрение заявки " data-en="Valuation and Approval of Loan ">Оценка и одобрение заявки </span><b th:text="${loan.loanNumber}" style="color:#00b894;"></b>
        </h2>
        <div class="subtitle" data-ru="Оцените вещь и подтвердите сумму займа" data-en="Evaluate the item and confirm the loan amount">Оцените вещь и подтвердите сумму займа</div>

        <form th:action="@{/loans/{id}/approve(id=${loan.id})}" method="post">

            <!-- Токен CSRF -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <h3 data-ru="Информация о клиенте" data-en="Client Information">Информация о клиенте</h3>
            <div class="form-group">
                <label data-ru="Клиент" data-en="Client">Клиент</label>
                <input type="text" th:value="${loan.client != null ? loan.client.fullName : '-'}" readonly>
            </div>

            <h3 data-ru="Что сдает клиент" data-en="What the client pawns">Что сдает клиент</h3>
            <div class="form-group">
                <label for="collateralName" data-ru="Название вещи" data-en="Item Name">Название вещи</label>
                <input type="text" id="collateralName" name="collateralName"
                       th:value="${not #lists.isEmpty(loan.collaterals) ? loan.collaterals[0].name : ''}" required>
            </div>
            <div class="form-group">
                <label for="collateralDescription" data-ru="Описание" data-en="Description">Описание</label>
                <textarea id="collateralDescription" name="collateralDescription" required
                          th:text="${not #lists.isEmpty(loan.collaterals) ? loan.collaterals[0].description : ''}"></textarea>
            </div>
            <div class="form-group">
                <label data-ru="Запрошенная сумма" data-en="Requested Amount">Запрошенная сумма</label>
                <input type="text" th:value="${loan.amount} + ' ₽'" readonly>
            </div>

            <h3 data-ru="Решение менеджера" data-en="Manager's Decision">Решение менеджера</h3>

            <div class="form-group">
                <label for="estimatedPrice" data-ru="Оценка вещи (₽)" data-en="Item Valuation (₽)">Оценка вещи (₽)</label>
                <!-- Имя поля estimatedPrice -->
                <input type="number" step="0.01" id="estimatedPrice" name="estimatedPrice" placeholder="Например: 20000" required>
            </div>

            <div class="form-group">
                <label for="approvedAmount" data-ru="Одобренная сумма (₽)" data-en="Approved Amount (₽)">Одобренная сумма (₽)</label>
                <!-- Имя поля approvedAmount -->
                <input type="number" step="0.01" id="approvedAmount" name="approvedAmount" th:value="${loan.amount}" required>
            </div>

            <div class="form-group">
                <label for="rate" data-ru="Ставка (%)" data-en="Rate (%)">Ставка (%)</label>
                <!-- Имя поля rate -->
                <input type="number" step="0.01" id="rate" name="rate" placeholder="Например: 11" required>
            </div>

            <button type="submit" class="btn-green" data-ru="Одобрить заем" data-en="Approve Loan">Одобрить заем</button>
        </form>

        <a th:href="@{/loans/{id}(id=${loan.id})}" class="btn-back" style="display:block; width:fit-content; margin:15px auto 0;"
           data-ru="← Назад к займу" data-en="← Back to Loan">← Назад к займу</a>
    </div>
</div>

<div th:replace="~{fragments/settings :: settings}"></div>
</body>
</html>
