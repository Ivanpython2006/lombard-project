<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title data-ru="Клиенты" data-en="Clients">Клиенты</title>
    <th:block th:replace="~{fragments/head :: styles}"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content with-sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; flex-wrap:wrap; gap:12px;">
        <h2 style="margin-bottom:0;" data-ru="Клиенты" data-en="Clients">Клиенты</h2>
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <a href="/admin/clients/new" class="btn-green"
               data-ru="+ Новый клиент" data-en="+ New Client">+ Новый клиент</a>
            <a href="/client/export" class="btn" data-ru="Экспорт CSV" data-en="Export CSV">Экспорт CSV</a>
        </div>
    </div>

    <form class="filter-bar" th:action="@{/client/search}" method="get" id="filterForm">
        <input type="text" name="query" th:value="${query}"
               data-ru="Поиск по номеру, имени, email или телефону..."
               data-en="Search by number, name, email or phone..."
               placeholder="Поиск по номеру, имени, email или телефону..."
               oninput="autoSubmit()">
        <span class="filter-divider"></span>
        <select name="sort" onchange="this.form.submit()">
            <option value="id" th:selected="${sort == 'id'}" data-ru="По номеру" data-en="By number">По номеру</option>
            <option value="name" th:selected="${sort == 'name'}" data-ru="По имени" data-en="By name">По имени</option>
            <option value="email" th:selected="${sort == 'email'}" data-ru="По email" data-en="By email">По email</option>
            <option value="phone" th:selected="${sort == 'phone'}" data-ru="По телефону" data-en="By phone">По телефону</option>
        </select>
    </form>

    <div class="table-wrap" th:if="${not #lists.isEmpty(clients)}">
        <table>
            <thead>
            <tr>
                <th data-ru="Номер" data-en="Number">Номер</th>
                <th data-ru="ФИО" data-en="Full Name">ФИО</th>
                <th data-ru="Email" data-en="Email">Email</th>
                <th data-ru="Телефон" data-en="Phone">Телефон</th>
                <th data-ru="Действия" data-en="Actions">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="client : ${clients}">
                <td><b th:text="${client.clientNumber}" style="color:#00b894;"></b></td>
                <td th:text="${client.fullName}"></td>
                <td th:text="${client.email} ?: '-'"></td>
                <td th:text="${client.phone} ?: '-'"></td>
                <td>
                    <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
                        <a th:href="@{/loans(clientName=${client.fullName}, status='')}"
                           class="action-btn"
                           style="padding:6px 14px; font-size:12px;"
                           data-ru="Займы" data-en="Loans">Займы</a>

                        <a th:href="@{/admin/clients/{id}/edit(id=${client.id})}"
                           class="action-btn approve"
                           style="padding:6px 14px; font-size:12px;"
                           data-ru="Редактировать" data-en="Edit">Редактировать</a>

                        <form th:action="@{/client/{id}/delete(id=${client.id})}" method="post"
                              style="display:inline; margin:0;"
                              onsubmit="return openConfirmForm(this, 'Удалить этого клиента? Все его займы также будут удалены.', 'Удалить')">
                            <button type="submit" class="action-btn reject"
                                    style="padding:6px 14px; font-size:12px;"
                                    data-ru="Удалить" data-en="Delete">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-message" th:if="${#lists.isEmpty(clients)}" data-ru="Клиентов не найдено." data-en="No clients found.">Клиентов не найдено.</div>

    <div class="pagination-wrap" th:if="${totalPages != null and totalPages > 1}">
        <div class="pagination-info">
            <span data-ru="Всего клиентов" data-en="Total clients">Всего клиентов</span>:
            <span th:text="${totalItems}"></span>,
            <span data-ru="страница" data-en="page">страница</span>
            <span th:text="${currentPage}"></span>
            <span data-ru="из" data-en="of">из</span>
            <span th:text="${totalPages}"></span>
        </div>
        <a th:if="${currentPage > 1}" th:href="@{/client/search(page=${currentPage - 1}, query=${query}, sort=${sort})}" class="page-btn">
            ← <span data-ru="Назад" data-en="Back">Назад</span>
        </a>
        <span th:if="${currentPage <= 1}" class="page-btn disabled">
            ← <span data-ru="Назад" data-en="Back">Назад</span>
        </span>
        <a th:each="i : ${#numbers.sequence(1, totalPages)}" th:href="@{/client/search(page=${i}, query=${query}, sort=${sort})}"
           class="page-btn" th:classappend="${i == currentPage} ? 'active' : ''" th:text="${i}"></a>
        <a th:if="${currentPage < totalPages}" th:href="@{/client/search(page=${currentPage + 1}, query=${query}, sort=${sort})}" class="page-btn">
            <span data-ru="Вперед" data-en="Next">Вперед</span> →
        </a>
        <span th:if="${currentPage >= totalPages}" class="page-btn disabled">
            <span data-ru="Вперед" data-en="Next">Вперед</span> →
        </span>
    </div>
</div>

<div th:replace="~{fragments/settings :: settings}"></div>

<script>
    let autoSubmitTimer = null;
    function autoSubmit() {
        clearTimeout(autoSubmitTimer);
        autoSubmitTimer = setTimeout(function() {
            document.getElementById('filterForm').submit();
        }, 500);
    }
</script>

</body>
</html>
