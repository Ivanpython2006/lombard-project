# Database settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lombard_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Files
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Uploads (collateral photos)
app.upload.dir=${UPLOAD_DIR:./uploads/}

# Logging
logging.level.org.springframework.boot.autoconfigure.orm.jpa=ERROR
logging.level.com.lombard=INFO